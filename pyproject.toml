[project]
name = "awesome-kiwi-tech"
version = "0.1.0"
description = "A curated list of tech resources, projects, and communities in Aotearoa New Zealand."
requires-python = ">=3.12"
dependencies = [
    "awesome-list @ git+https://github.com/olitreadwell/awesome-list-template@b05bd1a",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.uv]
package = false
